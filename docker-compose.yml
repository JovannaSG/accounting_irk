# Явное имя проекта: docker compose не может вывести его из имени папки
# с кириллицей (например «Тестовое_бухучет») и падает с ошибкой
# "project name must not be empty".
name: accounting-irk

services:
  app:
    build: .
    image: accounting_irk:latest
    container_name: accounting_irk
    ports:
      - "8501:8501"
    environment:
      # Точка монтирования БД. Держим рядом с описанием volume, чтобы путь,
      # куда пишет приложение, всегда совпадал с путём монтирования.
      AUDIT_DB_PATH: /app/dbdata/audit_history.db
    volumes:
      - ./users.json:/app/users.json:ro
      - ./client_databases.json:/app/client_databases.json:ro
      - audit_data:/app/dbdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  audit_data:
