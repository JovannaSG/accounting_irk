# Явное имя проекта: docker compose не может вывести его из имени папки
# с кириллицей (например «Тестовое_бухучет») и падает с ошибкой
# "project name must not be empty".
name: accounting-irk

services:
  app:
    build: .
    image: accounting_irk:latest
    env_file:
      - .env
    container_name: accounting_irk
    ports:
      - "8501:8501"
    volumes:
      - ./users.json:/app/users.json:ro
      - ./client_databases.json:/app/client_databases.json:ro
      - audit_data:/app/audit_history.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  audit_data:
